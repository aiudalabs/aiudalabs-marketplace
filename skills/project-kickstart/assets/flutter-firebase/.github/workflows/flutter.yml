# Owner: flutter-dev. Validates the Flutter lane: apps/** and packages/** (Melos).
# One workflow per lane; see docs/AGENT_ROSTER.md.
name: flutter

on:
  # Called by the deploy workflows, so they run these checks instead of copying the jobs.
  workflow_call:
  pull_request:
    branches: [main, develop]
    paths: ['apps/**', 'packages/**', 'melos.yaml', 'pubspec.yaml', 'pubspec.lock', 'tools/deps-check.mjs', '.github/workflows/flutter.yml']
  push:
    branches: [develop]
    paths: ['apps/**', 'packages/**', 'melos.yaml', 'pubspec.yaml', 'pubspec.lock', 'tools/deps-check.mjs', '.github/workflows/flutter.yml']

jobs:
  flutter:
    name: Flutter apps and packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Find Dart packages
        id: detect
        run: |
          if ls apps/*/pubspec.yaml packages/*/pubspec.yaml >/dev/null 2>&1; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "No Dart package yet (apps/ and packages/ have no pubspec.yaml); nothing to check."
          fi
      - if: steps.detect.outputs.present == 'true'
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '{{flutter_version}}'
          cache: true
      # melos.yaml is the Melos 6 format; Melos 7+ reads its config from pubspec.yaml instead.
      # GitHub sets CI=true, which keeps Melos from prompting (it crashes without a TTY).
      - if: steps.detect.outputs.present == 'true'
        run: dart pub global activate melos '>=6.3.0 <7.0.0'
      - if: steps.detect.outputs.present == 'true'
        run: melos bootstrap
      - if: steps.detect.outputs.present == 'true'
        run: melos run deps-check
      - if: steps.detect.outputs.present == 'true'
        run: melos run analyze
      - if: steps.detect.outputs.present == 'true'
        run: melos run format-check
      - if: steps.detect.outputs.present == 'true'
        run: melos run tests-present
      - if: steps.detect.outputs.present == 'true'
        run: melos run test
