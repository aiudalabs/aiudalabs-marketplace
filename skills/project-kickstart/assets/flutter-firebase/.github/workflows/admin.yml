# Owner: react-dev. Validates the admin lane: admin/**.
# One workflow per lane; see docs/AGENT_ROSTER.md.
# The scaffold has `lint`, `typecheck` (tsc -b), `test` (vitest) and `build` (tsc -b && vite build).
name: admin

on:
  pull_request:
    branches: [main, develop]
    paths: ['admin/**', 'packages-ts/**', 'pnpm-lock.yaml', '.github/workflows/admin.yml']
  push:
    branches: [develop]
    paths: ['admin/**', 'packages-ts/**', 'pnpm-lock.yaml', '.github/workflows/admin.yml']

jobs:
  admin:
    name: Admin dashboard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4   # version from "packageManager" in package.json
      - uses: actions/setup-node@v4
        with:
          node-version: '{{node_version}}'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm --dir admin run lint
      - run: pnpm --dir admin run typecheck
      - run: pnpm --dir admin run test
      - run: pnpm --dir admin run build
