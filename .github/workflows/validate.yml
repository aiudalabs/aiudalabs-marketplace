name: Validate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm run validate
      - run: npm test
      - name: Changed components have a new version
        if: github.event_name == 'pull_request'
        run: node scripts/check-versions.mjs "origin/${{ github.base_ref }}"
